name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dev tools
        run: pip install ruff mypy types-requests pydantic-settings
      - name: Ruff lint
        run: ruff check src/ evaluation/ demo/
      - name: Ruff format check
        run: ruff format --check src/ evaluation/ demo/
      - name: Mypy type-check
        run: mypy src/ --ignore-missing-imports --no-strict-optional

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A live API key once shipped inside a .env that was git-ignored but still
      # present in the working tree. Ignoring a file protects the repository, not
      # an archive built from a checkout — so this runs in CI as well as in the
      # pre-commit hook.
      - name: Scan tracked files for credentials
        run: python src/hooks/pre_commit_hook.py --scan-tracked

  unit-tests:
    name: Unit & governance tests (no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      # No LLM key is set here on purpose. The LLM-graded tests detect that and
      # skip themselves; everything else is deterministic. Setting a fake
      # OPENAI_API_KEY (as this job used to) defeats that skip and makes the
      # graded tests fail against a key that cannot possibly work.
      - name: Run deterministic tests
        run: pytest evaluation/ -v --cov=src --cov-report=xml --cov-report=term-missing
        env:
          DEMO_MODE: "true"
          API_AUTH_ENABLED: "false"
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  eval-tests:
    name: Agent evaluation (LLM-graded)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      # Skips itself cleanly when the repo has no GROQ_API_KEY secret, so a fork
      # sees green rather than red for a reason it cannot fix.
      - name: Run LLM-graded evaluation
        run: pytest evaluation/test_agents.py -v --tb=short
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEMO_MODE: "true"
          LLM_MODEL: "groq/qwen/qwen3.6-27b"

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t gcb-crisis-squad:${{ github.sha }} .
      - name: Config smoke test
        run: |
          docker run --rm -e DEMO_MODE=true \
            gcb-crisis-squad:${{ github.sha }} \
            python -c "from src.config import settings; print('Config OK:', settings.llm_model)"
      # Proves the packaged image can actually run an incident to the gate and
      # halt there, not merely import its own settings module.
      - name: End-to-end smoke test (graph runs to the HitL gate)
        run: |
          docker run --rm -e DEMO_MODE=true -e API_AUTH_ENABLED=false \
            gcb-crisis-squad:${{ github.sha }} \
            python demo/run_demo.py --decision REJECTED
