[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gcb-crisis-squad"
version = "0.2.0"
description = "AI-native autonomous incident response system — multi-agent with Human-in-the-Loop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Chad" }]
keywords = ["agents", "langgraph", "incident-response", "sre", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # MCP server — Model Context Protocol (Claude Code, Cursor, Kiro, Codex integration)
    "mcp[cli]>=1.9.0",

    # Multi-agent orchestration
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-groq>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-huggingface>=0.0.3",
    "langchain-text-splitters>=0.2.0",

    # RAG / vector store
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0",
    "tiktoken>=0.7.0",

    # Observability — OpenTelemetry + LangSmith
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "langsmith>=0.1.0",

    # API & tooling
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # HTTP
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "msal>=1.29.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.9.0",
    "rich>=13.7.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "deepeval>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests>=2.32.0",
]
observability = [
    # Langfuse — distributed LLM tracing (replaces LangSmith if preferred)
    "langfuse>=2.0.0",
]

[project.scripts]
gcb-server = "src.api.server:main"
gcb-mcp    = "src.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",     # line too long — handled by formatter
    "B008",     # FastAPI uses Security() as default argument — standard pattern
    "SIM102",   # nested if — sometimes more readable than single compound
    "SIM105",   # contextlib.suppress — explicit try/except is clearer
    "SIM108",   # ternary — if/else is more readable in complex branches
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["evaluation"]
addopts = "-v --tb=short"
filterwarnings = [
    # DeepEval internals use deprecated asyncio.iscoroutinefunction (Python 3.14)
    "ignore::DeprecationWarning:deepeval",
    # DeepEval LLMTestCaseParams renamed to SingleTurnParams
    "ignore:.*LLMTestCaseParams.*deprecated.*:DeprecationWarning",
    # pydantic V1 compat shims
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]
